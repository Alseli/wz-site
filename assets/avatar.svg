<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240"
     width="240" height="240" role="img" aria-label="占位头像">
  <!-- =====================================================================
       这是一个占位头像，请替换成你自己的照片：
         1. 把照片存成 assets/portrait.jpg（正方形最好，比如 800x800）
         2. 回到 index.html，把 <img class="avatar" ...> 的 src 改成
            assets/portrait.jpg，并把 alt 改成「你的名字的头像」
       这个文件可以直接删掉。
       ===================================================================== -->
  <title>占位头像</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0f2f28"/>
      <stop offset="55%"  stop-color="#0d1a2b"/>
      <stop offset="100%" stop-color="#111329"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="52%">
      <stop offset="0%"   stop-color="#2ee6a8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#2ee6a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆形底 + 柔光 -->
  <circle cx="120" cy="120" r="120" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="120" fill="url(#halo)"/>

  <!-- 装饰同心环 -->
  <g fill="none" stroke="#2ee6a8" stroke-opacity=".28" stroke-width="1.5">
    <circle cx="120" cy="120" r="96"/>
    <circle cx="120" cy="120" r="72"/>
  </g>

  <!-- 抽象人像剪影 -->
  <g fill="#e8fbf4" fill-opacity=".92">
    <circle cx="120" cy="98" r="27"/>
    <path d="M120 133c29 0 52 19 55 45a5 5 0 0 1-5 6H70a5 5 0 0 1-5-6c3-26 26-45 55-45z"/>
  </g>

  <!-- 角标提示：这是占位图 -->
  <g transform="translate(120 220)">
    <rect x="-56" y="-13" width="112" height="26" rx="13"
          fill="#0b1220" fill-opacity=".72" stroke="#2ee6a8" stroke-opacity=".45" stroke-width="1"/>
    <text x="0" y="3.5" text-anchor="middle" fill="#7ff0c8"
          font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12"
          letter-spacing=".04em">替换成你的照片</text>
  </g>
</svg>
