<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 站点图标：显示在浏览器标签页。想换成自己的，替换本文件即可（保持文件名不变）。 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#3ef0b4"/>
      <stop offset="100%" stop-color="#17b98a"/>
    </linearGradient>
  </defs>

  <!-- 圆角底 -->
  <rect width="32" height="32" rx="8" fill="url(#g)"/>

  <!-- 抽象字母标记（深色，压在渐变底上） -->
  <g fill="none" stroke="#08231b" stroke-width="3.1"
     stroke-linecap="square" stroke-linejoin="miter">
    <path d="M11 8.5v15"/>
    <path d="M11 23.5h10"/>
  </g>
  <g stroke="#08231b" stroke-width="3.1" stroke-linecap="square">
    <path d="M15.6 8.5h5.4v9.4"/>
  </g>
</svg>
